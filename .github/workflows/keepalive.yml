name: Keepalive

# GitHub desactiva los workflows programados si el repo pasa 60 dias sin actividad.
# Este job hace un commit vacio una vez por mes para que eso no pase nunca.

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: mantener vivo el cron"
          git push
